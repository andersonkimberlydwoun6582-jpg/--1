<body><main><h1>聚宽课程完整快照：七、数据获取</h1><p>本站离线快照 · UTF-8 编码 · 无需登录</p><pre id="content">正在读取快照…</pre></main>
<script>
fetch('/joinquant-snapshot.txt').then(function(response){return response.arrayBuffer();}).then(function(buffer){document.getElementById('content').textContent=new TextDecoder('utf-8').decode(buffer);}).catch(function(){document.getElementById('content').textContent='快照读取失败，请返回课程库重试。';});
</script></body></html>
